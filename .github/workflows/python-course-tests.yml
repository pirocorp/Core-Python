name: Python Course Tests

on:
  pull_request:
    paths:
      - "01. CPython Memory Model and the GIL/**"
      - "02. Threads, Processes and Async IO/**"
      - "03. Context Managers and Resource Safety/**"
      - "04. Decorators, Closures and Cross-Cutting Concerns/**"
      - "05. Abstract Base Classes and Interface-Like Contracts/**"
      - "06. Inheritance, Multiple Inheritance and MRO/**"
      - "07. Runtime Polymorphism and Duck Typing/**"
      - "08. Composition and Object Collaboration/**"
      - "09. Encapsulation, Properties and Python Conventions/**"
      - "README.md"
      - "CURRICULUM.md"
      - "tests/**"
      - ".github/workflows/python-course-tests.yml"
  push:
    branches: [main]
    paths:
      - "01. CPython Memory Model and the GIL/**"
      - "02. Threads, Processes and Async IO/**"
      - "03. Context Managers and Resource Safety/**"
      - "04. Decorators, Closures and Cross-Cutting Concerns/**"
      - "05. Abstract Base Classes and Interface-Like Contracts/**"
      - "06. Inheritance, Multiple Inheritance and MRO/**"
      - "07. Runtime Polymorphism and Duck Typing/**"
      - "08. Composition and Object Collaboration/**"
      - "09. Encapsulation, Properties and Python Conventions/**"
      - "README.md"
      - "CURRICULUM.md"
      - "tests/**"
      - ".github/workflows/python-course-tests.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test Lesson 01
        run: python -m unittest discover -s "01. CPython Memory Model and the GIL/tests" -v
      - name: Test Lesson 02
        run: python -m unittest discover -s "02. Threads, Processes and Async IO/tests" -v
      - name: Test Lesson 03
        run: python -m unittest discover -s "03. Context Managers and Resource Safety/tests" -v
      - name: Test Lesson 04
        run: python -m unittest discover -s "04. Decorators, Closures and Cross-Cutting Concerns/tests" -v
      - name: Test Lesson 05
        run: python -m unittest discover -s "05. Abstract Base Classes and Interface-Like Contracts/tests" -v
      - name: Test Lesson 06
        run: python -m unittest discover -s "06. Inheritance, Multiple Inheritance and MRO/tests" -v
      - name: Test Lesson 07
        run: python -m unittest discover -s "07. Runtime Polymorphism and Duck Typing/tests" -v
      - name: Test Lesson 08
        run: python -m unittest discover -s "08. Composition and Object Collaboration/tests" -v
      - name: Test Lesson 09
        run: python -m unittest discover -s "09. Encapsulation, Properties and Python Conventions/tests" -v
      - name: Test Course Index and Publication Integrity
        run: python -m unittest discover -s tests -v
